<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1e3d"/>
      <stop offset="40%" stop-color="#1e3a5f"/>
      <stop offset="75%" stop-color="#7c4a36"/>
      <stop offset="100%" stop-color="#d97736"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="concreteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Twilight Sky -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Distant Tropical Foliage / Silhouette -->
  <path d="M0,520 Q200,490 400,510 T800,480 T1200,500 L1200,800 L0,800 Z" fill="#09141d"/>

  <!-- Surrounding Luxury Deck / Travertine Paving -->
  <polygon points="150,620 650,470 1100,570 520,770" fill="#64748b" fill-opacity="0.4"/>
  <polygon points="180,630 650,480 1080,580 540,760" fill="#334155"/>

  <!-- Infinity Pool with Glowing Underwater LEDs -->
  <polygon points="320,630 520,570 700,615 480,685" fill="url(#poolGrad)"/>
  <!-- Pool Reflection and Water Ripples -->
  <polygon points="330,635 510,578 680,618 475,680" fill="#38bdf8" fill-opacity="0.5" filter="url(#glow)"/>
  
  <!-- Ground Floor Glass Pavilion & Warm Interior Lighting -->
  <polygon points="450,530 850,450 850,330 450,410" fill="url(#warmLight)" filter="url(#glow)"/>
  <polygon points="450,410 850,330 980,360 580,440" fill="#0f172a"/>
  
  <!-- Interior Luxury Furniture Silhouettes -->
  <rect x="520" y="440" width="120" height="40" rx="6" fill="#1e293b" fill-opacity="0.8"/>
  <line x1="530" y1="410" x2="530" y2="440" stroke="#fde047" stroke-width="2"/>
  <circle cx="530" cy="442" r="8" fill="#fef08a" filter="url(#glow)"/>

  <!-- Floating Upper Level Concrete Cantilever -->
  <polygon points="380,360 820,280 820,160 380,240" fill="url(#concreteGrad)"/>
  <polygon points="380,240 820,160 920,185 480,265" fill="#64748b"/>
  <polygon points="820,280 920,305 920,185 820,160" fill="#1e293b"/>

  <!-- Teak Wood Louvers / Slats with Recessed LED Lighting -->
  <g fill="url(#woodGrad)">
    <rect x="420" y="240" width="12" height="110" rx="2"/>
    <rect x="440" y="236" width="12" height="110" rx="2"/>
    <rect x="460" y="232" width="12" height="110" rx="2"/>
    <rect x="480" y="228" width="12" height="110" rx="2"/>
    <rect x="500" y="224" width="12" height="110" rx="2"/>
    <rect x="520" y="220" width="12" height="110" rx="2"/>
  </g>
  
  <!-- Architectural LED Linear Light Strips (Sal LED System) -->
  <line x1="380" y1="362" x2="820" y2="282" stroke="#fde047" stroke-width="4" filter="url(#glow)"/>
  <line x1="450" y1="532" x2="850" y2="452" stroke="#fde047" stroke-width="3" filter="url(#glow)"/>

  <!-- Upper Balcony Glass Railing -->
  <polygon points="560,260 810,210 810,235 560,285" fill="#38bdf8" fill-opacity="0.2" stroke="#93c5fd" stroke-width="1"/>

  <!-- Lush Tropical Palm Trees & Landscaping -->
  <g filter="url(#glow)">
    <!-- Poolside Spotlights -->
    <circle cx="280" cy="620" r="14" fill="#fde047" fill-opacity="0.8"/>
    <circle cx="740" cy="610" r="14" fill="#fde047" fill-opacity="0.8"/>
  </g>
  
  <!-- Palm Silhouette -->
  <path d="M260,620 Q270,480 250,380 Q290,420 330,460 M250,380 Q310,360 380,390 M250,380 Q220,330 190,320 M250,380 Q200,380 150,410" stroke="#0f291e" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M1020,600 Q1010,450 1030,340 Q980,380 940,420 M1030,340 Q1080,320 1140,350 M1030,340 Q1060,290 1090,280" stroke="#0f291e" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- 4K Studio Badge -->
  <rect x="1000" y="730" width="160" height="40" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1"/>
  <text x="1080" y="756" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">SAL AI 4K ULTRA</text>
</svg>